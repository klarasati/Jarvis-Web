<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jarvis</title>
    <style>
        /* Desain ala hologram Iron Man */
        body { 
            background-color: #050505; 
            color: #00ffcc; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        h1 { text-shadow: 0 0 10px #00ffcc; text-align: center; }
        #chat-box { 
            width: 90%; 
            max-width: 600px; 
            height: 400px; 
            border: 1px solid #00ffcc; 
            overflow-y: auto; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 10px; 
            background: rgba(0, 255, 204, 0.05); 
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2); 
        }
        .pesan { margin-bottom: 15px; line-height: 1.5; }
        .user { color: #ffffff; text-align: right; }
        .jarvis { color: #00ffcc; text-align: left; text-shadow: 0 0 3px #00ffcc; }
        .input-area { width: 90%; max-width: 600px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;}
        input { 
            flex: 1; 
            min-width: 200px;
            padding: 12px; 
            border-radius: 5px; 
            border: 1px solid #00ffcc; 
            background: #111; 
            color: #fff; 
            outline: none;
        }
        button { 
            padding: 12px 20px; 
            border-radius: 5px; 
            border: none; 
            background: #00ffcc; 
            color: #000; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 0 10px #00ffcc; 
        }
        button:hover { background: #00ccaa; }
        #btn-mic { background: #ff0055; color: white; box-shadow: 0 0 10px #ff0055;}
        #btn-mic:hover { background: #cc0044; }
    </style>
</head>
<body>
    <h1>[ SYSTEM JARVIS ONLINE ]</h1>
    
    <div id="chat-box">
        <div class="pesan jarvis">Jarvis: Sistem suara aktif. Silakan tekan tombol mikrofon untuk berbicara.</div>
    </div>
    
    <div class="input-area">
        <button id="btn-mic" onclick="mulaiMendengar()">🎙️ BICARA</button>
        <input type="text" id="input-teks" placeholder="Atau ketik di sini..." onkeypress="jikaTekanEnter(event)">
        <button onclick="kirimPesan()">KIRIM</button>
    </div>

    <script>
        // --- BAGIAN 1: MULUT JARVIS (Text to Speech) ---
        function bicara(teks) {
            const suara = new SpeechSynthesisUtterance(teks);
            suara.lang = 'id-ID'; // Menggunakan aksen Bahasa Indonesia
            window.speechSynthesis.speak(suara);
        }

        // --- BAGIAN 2: TELINGA JARVIS (Speech to Text) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID'; // Mendengarkan Bahasa Indonesia
            recognition.interimResults = false; // Tunggu sampai kita selesai bicara

            recognition.onresult = function(event) {
                // Saat kita selesai bicara, teksnya dimasukkan ke kotak input
                const teksSuara = event.results[0][0].transcript;
                document.getElementById('input-teks').value = teksSuara;
                document.getElementById('btn-mic').innerText = "🎙️ BICARA"; // Kembalikan tombol
                kirimPesan(); // Otomatis mengirim pesan setelah kita selesai bicara
            };

            recognition.onerror = function(event) {
                document.getElementById('btn-mic').innerText = "🎙️ BICARA";
                alert("Gagal mendengarkan. Pastikan izin mikrofon sudah diberikan.");
            };
        } else {
            alert("Browser Anda tidak mendukung fitur suara. Gunakan Google Chrome.");
        }

        function mulaiMendengar() {
            if (recognition) {
                document.getElementById('btn-mic').innerText = "🔴 Mendengarkan...";
                recognition.start();
            }
        }

        // --- BAGIAN 3: MENGHUBUNGKAN KE OTAK AI ---
        async function kirimPesan() {
            const inputField = document.getElementById('input-teks');
            const teks = inputField.value;
            if (!teks) return;

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="pesan user">Anda: ${teks}</div>`;
            inputField.value = ''; 
            chatBox.scrollTop = chatBox.scrollHeight; 

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: teks }]
                    })
                });

                const data = await response.json();
                const jawabanJarvis = data.choices[0].message.content;
                
                // Menampilkan teks di layar
                chatBox.innerHTML += `<div class="pesan jarvis">Jarvis: ${jawabanJarvis}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                
                // Menyuruh Jarvis berbicara langsung!
                bicara(jawabanJarvis);

            } catch (error) {
                chatBox.innerHTML += `<div class="pesan jarvis">Error: Koneksi ke otak terputus.</div>`;
            }
        }

        function jikaTekanEnter(event) {
            if (event.key === "Enter") {
                kirimPesan();
            }
        }
    </script>
</body>
</html>
