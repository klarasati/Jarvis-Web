<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jarvis</title>
    <style>
        /* Desain ala hologram Iron Man */
        body { 
            background-color: #050505; 
            color: #00ffcc; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        h1 { text-shadow: 0 0 10px #00ffcc; }
        #chat-box { 
            width: 90%; 
            max-width: 600px; 
            height: 400px; 
            border: 1px solid #00ffcc; 
            overflow-y: auto; 
            padding: 15px; 
            margin-bottom: 20px; 
            border-radius: 10px; 
            background: rgba(0, 255, 204, 0.05); 
            box-shadow: inset 0 0 15px rgba(0, 255, 204, 0.2); 
        }
        .pesan { margin-bottom: 15px; line-height: 1.5; }
        .user { color: #ffffff; text-align: right; }
        .jarvis { color: #00ffcc; text-align: left; text-shadow: 0 0 3px #00ffcc; }
        .input-area { width: 90%; max-width: 600px; display: flex; gap: 10px; }
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 5px; 
            border: 1px solid #00ffcc; 
            background: #111; 
            color: #fff; 
            outline: none;
        }
        button { 
            padding: 12px 20px; 
            border-radius: 5px; 
            border: none; 
            background: #00ffcc; 
            color: #000; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 0 10px #00ffcc; 
        }
        button:hover { background: #00ccaa; }
    </style>
</head>
<body>
    <h1>[ SYSTEM JARVIS ONLINE ]</h1>
    
    <div id="chat-box">
        <div class="pesan jarvis">Jarvis: Sistem siap. Ada yang bisa saya bantu?</div>
    </div>
    
    <div class="input-area">
        <input type="text" id="input-teks" placeholder="Ketik perintah di sini..." onkeypress="jikaTekanEnter(event)">
        <button onclick="kirimPesan()">KIRIM</button>
    </div>

    <script>
        // Logika untuk mengirim teks ke "Pelayan Rahasia" yang kita buat tadi
        async function kirimPesan() {
            const inputField = document.getElementById('input-teks');
            const teks = inputField.value;
            if (!teks) return;

            const chatBox = document.getElementById('chat-box');
            // Menampilkan pesan Anda di layar
            chatBox.innerHTML += `<div class="pesan user">Anda: ${teks}</div>`;
            inputField.value = ''; // Kosongkan kotak ketik
            chatBox.scrollTop = chatBox.scrollHeight; // Gulir ke bawah otomatis

            try {
                // Mengetuk pintu Brankas Vercel (api/chat)
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: teks }]
                    })
                });

                const data = await response.json();
                // Mengambil jawaban dari Groq AI dan menampilkannya
                const jawabanJarvis = data.choices[0].message.content;
                chatBox.innerHTML += `<div class="pesan jarvis">Jarvis: ${jawabanJarvis}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                chatBox.innerHTML += `<div class="pesan jarvis">Error: Koneksi ke otak terputus.</div>`;
            }
        }

        // Biar bisa kirim pakai tombol Enter di keyboard
        function jikaTekanEnter(event) {
            if (event.key === "Enter") {
                kirimPesan();
            }
        }
    </script>
</body>
</html>
